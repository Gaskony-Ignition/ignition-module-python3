# Python 3 Integration Scripting Functions Documentation
# Used by Ignition Designer for scripting function tooltips and autocomplete help.
#
# Format: functionName.desc, functionName.param.paramName, functionName.returns
# For overloads with the same name, the last definition wins - describe the full overload set.

# =============================================================================
# system.python3.exec  - Execute Python 3 code statements
# =============================================================================
exec.desc=Execute one or more Python 3 statements on the Gateway. \
  To return a value, assign it to a variable named 'result'. \
  Variables passed in the 'variables' dict are available directly by name.\n\n\
  Examples:\n\
    system.python3.exec("print('hello')")\n\
    system.python3.exec("result = 2 + 2")  # returns 4\n\
    system.python3.exec("result = x * y", {"x": 10, "y": 5})  # returns 50\n\
    system.python3.exec("import datetime\\nresult = str(datetime.date.today())")\n\n\
  Notes:\n\
  - Code runs in a subprocess pool (default 3 workers, 30s timeout)\n\
  - Use 'result' variable to return a value; if not set, returns all locals\n\
  - Multi-line code: use \\n for newlines or triple-quoted strings\n\
  - For single expressions, prefer system.python3.eval() instead

exec.param.code=Python 3 code to execute. Use semicolons or \\n for multiple statements. \
  Assign to 'result' variable to return a value. \
  Example: "import math\\nresult = math.pi * radius**2"

exec.param.variables=Optional dictionary of variables to inject into the Python scope. \
  Keys become variable names, values are passed as Python objects. \
  Example: {"radius": 5.0, "name": "Alice", "tags": ["a", "b"]}

exec.returns=The value of the 'result' variable if set; otherwise a dict of all local \
  variables. Returns None if no result was set and no locals exist. \
  Throws RuntimeException if Python raises an error.

# =============================================================================
# system.python3.eval  - Evaluate a Python 3 expression
# =============================================================================
eval.desc=Evaluate a single Python 3 expression and return its value. \
  Unlike exec(), eval() is for expressions (not statements) - no assignment needed.\n\n\
  Examples:\n\
    system.python3.eval("2 + 2")  # returns 4\n\
    system.python3.eval("x ** 2", {"x": 9})  # returns 81\n\
    system.python3.eval("len(items)", {"items": [1,2,3,4,5]})  # returns 5\n\
    system.python3.eval("[i*i for i in range(5)]")  # returns [0,1,4,9,16]\n\
    system.python3.eval("{'key': 'value'}")  # returns a dict\n\n\
  Notes:\n\
  - Must be a single expression - statements (if, for, import) are not allowed\n\
  - For multi-line code or statements, use system.python3.exec() instead\n\
  - The expression result is returned directly (no 'result' variable needed)

eval.param.expression=A single Python 3 expression to evaluate. Must return a value. \
  Examples: "x + y", "len(data)", "[i for i in range(10)]", "datetime.date.today()"

eval.param.variables=Optional dictionary of variables available in the expression scope. \
  Example: {"x": 10, "y": 20} makes x and y usable in the expression.

eval.returns=The direct result of the expression. Type depends on the expression: \
  int, float, str, list, dict, bool, or None. \
  Throws RuntimeException if Python raises an error or if expression is a statement.

# =============================================================================
# system.python3.callModule  - Call a Python standard library or installed package function
# =============================================================================
callModule.desc=Call a specific function from any installed Python 3 module. \
  Useful for calling standard library functions or pip-installed packages without \
  writing full exec() code.\n\n\
  Examples:\n\
    system.python3.callModule("math", "sqrt", [16])  # returns 4.0\n\
    system.python3.callModule("math", "factorial", [10])  # returns 3628800\n\
    system.python3.callModule("json", "dumps", [{"key": "val"}])  # returns JSON string\n\
    system.python3.callModule("random", "randint", [1, 100])  # random int 1-100\n\
    system.python3.callModule("os.path", "exists", ["/etc/hosts"])  # returns True/False\n\n\
  Notes:\n\
  - The module must be importable in the Gateway's Python environment\n\
  - Use system.python3.exec() for more complex module interactions\n\
  - Install missing packages via the Script Console Packages button or Gateway Web UI

callModule.param.moduleName=The Python module to import. Can be a submodule path. \
  Examples: "math", "json", "os.path", "datetime", "numpy", "pandas"

callModule.param.functionName=The function to call within the module. \
  Examples: "sqrt", "dumps", "exists", "now", "DataFrame"

callModule.param.args=List of positional arguments to pass to the function. \
  Use an empty list [] if no arguments are needed. \
  Example: [16] for math.sqrt(16), or [1, 100] for random.randint(1, 100)

callModule.param.kwargs=Optional dictionary of keyword arguments. \
  Example: {"indent": 2} for json.dumps(obj, indent=2)

callModule.returns=The return value of the function call. Type depends on the function. \
  Throws RuntimeException if the module cannot be imported or the function fails.

# =============================================================================
# system.python3.callScript  - Call a saved script by name
# =============================================================================
callScript.desc=Execute a previously saved Python 3 script by its name or folder path. \
  Scripts are saved from the Script Console or Gateway Web UI. \
  The script's 'result' variable is returned to the caller.\n\n\
  Examples:\n\
    system.python3.callScript("My Script")  # runs top-level script\n\
    system.python3.callScript("Reports/Daily Summary")  # runs script in folder\n\
    system.python3.callScript("Process Data", [item1, item2])  # passes args list\n\
    val = system.python3.callScript("Calc Tax", [], {"rate": 0.08, "amount": 100})\n\n\
  In the script itself, use:\n\
    args[0]  # first positional argument\n\
    kwargs["rate"]  # named argument\n\
    result = computed_value  # this is returned to the caller\n\n\
  Notes:\n\
  - Script must exist in the Gateway's script repository\n\
  - Use system.python3.getAvailableScripts() to discover saved script names\n\
  - Folder paths use forward slash: "FolderName/ScriptName"

callScript.param.scriptPath=Name of the saved script, or folder/name for scripts in folders. \
  Case-sensitive. Examples: "My Script", "Utilities/Format Date", "Reports/Daily"

callScript.param.args=Optional list of positional arguments. Available inside the script \
  as the 'args' variable. Example: [42, "hello", True]

callScript.param.kwargs=Optional dict of keyword arguments. Available inside the script \
  as the 'kwargs' variable. Example: {"temperature": 98.6, "unit": "F"}

callScript.returns=The value of the 'result' variable set inside the script, or None \
  if the script did not set a result variable. \
  Throws RuntimeException if script is not found or raises a Python error.

# =============================================================================
# system.python3.isAvailable  - Check if Python 3 is ready
# =============================================================================
isAvailable.desc=Check whether the Python 3 process pool is initialized and healthy. \
  Use this before calling exec/eval in scripts that need to handle unavailability gracefully.\n\n\
  Example:\n\
    if system.python3.isAvailable():\n\
        result = system.python3.eval("2 + 2")\n\
    else:\n\
        system.perspective.print("Python 3 not available")

isAvailable.returns=True if the process pool is initialized and running; False otherwise. \
  Returns False if the pool was never started, shut down, or all workers are unhealthy.

# =============================================================================
# system.python3.getVersion  - Get Python version information
# =============================================================================
getVersion.desc=Returns information about the Python 3 version running on the Gateway.\n\n\
  Example:\n\
    info = system.python3.getVersion()\n\
    system.perspective.print("Python: " + info["version"])\n\
    # Prints something like: "Python: 3.11.5 (main, Sep 11 2023, 08:31:25)"

getVersion.returns=Dictionary with keys: \
  "version" (full version string, e.g. "3.11.5 (main, Sep 11 2023, ...)"), \
  "available" (True/False). \
  On error, returns {"available": False, "error": "message"}.

# =============================================================================
# system.python3.getPoolStats  - Get process pool statistics
# =============================================================================
getPoolStats.desc=Returns runtime statistics about the Python 3 process pool. \
  Useful for monitoring and diagnostics.\n\n\
  Example:\n\
    stats = system.python3.getPoolStats()\n\
    logger.info("Pool: {}/{} workers in use".format(stats["inUse"], stats["poolSize"]))\n\n\
  Returned keys:\n\
  - poolSize: total number of worker processes (e.g. 3)\n\
  - available: workers currently idle and ready\n\
  - inUse: workers currently executing code\n\
  - healthy: number of workers responding to health checks

getPoolStats.returns=Dictionary with integer keys: poolSize, available, inUse, healthy. \
  Example: {"poolSize": 3, "available": 2, "inUse": 1, "healthy": 3}. \
  Returns {"error": "message"} if pool is not initialized.

# =============================================================================
# system.python3.getAvailableScripts  - List all saved scripts
# =============================================================================
getAvailableScripts.desc=Returns a list of all saved Python 3 scripts with their metadata. \
  Useful for building dynamic script selectors or discovering available scripts.\n\n\
  Example:\n\
    scripts = system.python3.getAvailableScripts()\n\
    for s in scripts:\n\
        logger.info(s["name"] + ": " + s["description"])\n\n\
  To call a discovered script:\n\
    scripts = system.python3.getAvailableScripts()\n\
    paths = [s["path"] for s in scripts]\n\
    result = system.python3.callScript(paths[0])

getAvailableScripts.returns=List of dictionaries, each containing: \
  "name" (script display name), \
  "path" (full path including folder, e.g. "Reports/Daily"), \
  "description" (optional description string), \
  "author" (optional author string), \
  "version" (optional version string), \
  "lastModified" (timestamp string). \
  Returns empty list if no scripts exist or repository is not initialized.

# =============================================================================
# system.python3.example  - Quick test function
# =============================================================================
example.desc=Runs a quick test to verify Python 3 is working correctly. \
  Calculates 2^100 and returns a confirmation string.\n\n\
  Example:\n\
    result = system.python3.example()\n\
    # Returns: "Python 3 is working! 2^100 = 1267650600228229401496703205376"\n\n\
  Use this to verify connectivity after installing or restarting the module.

example.returns=A string in the format "Python 3 is working! 2^100 = <value>" on success, \
  or "Python 3 error: <message>" if Python 3 is unavailable.

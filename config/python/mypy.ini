# MyPy Configuration for Python Bridge
# Static type checking for Python 3.9+

[mypy]
python_version = 3.9

# Import discovery
mypy_path = python3-integration/gateway/src/main/resources
files = python3-integration/gateway/src/main/resources/python_bridge.py

# Strictness options (gradual adoption)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_calls = False

# Error reporting
show_error_codes = True
show_error_context = True
show_column_numbers = True
pretty = True

# Warnings
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Miscellaneous
warn_incomplete_stub = True

# Suppression
ignore_missing_imports = True

# Per-module options
[mypy-tests.*]
disallow_untyped_defs = False

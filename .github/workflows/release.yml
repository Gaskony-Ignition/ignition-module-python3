name: Build, Release & Publish to Portal

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up module signing
        run: |
          SIGNING_DIR="${HOME}/.ignition-signing"
          mkdir -p "$SIGNING_DIR"
          echo "${SIGNING_KEYSTORE_B64}" | base64 -d > "$SIGNING_DIR/gaskony-keystore.jks"
          echo "${SIGNING_CERT_B64}" | base64 -d > "$SIGNING_DIR/gaskony-cert.pem"
          {
            echo "ignition.signing.keystoreFile=${SIGNING_DIR}/gaskony-keystore.jks"
            echo "ignition.signing.keystorePassword=${SIGNING_PASSWORD}"
            echo "ignition.signing.certAlias=gaskony-module"
            echo "ignition.signing.certPassword=${SIGNING_PASSWORD}"
            echo "ignition.signing.certFile=${SIGNING_DIR}/gaskony-cert.pem"
          } > gradle.properties
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build module
        run: ./gradlew clean build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find and verify signed modl file
        id: modl
        run: |
          MODL_FILE=$(find build -maxdepth 1 -name "Python3-*.modl" ! -name "*.unsigned.modl" | head -1)
          if [ -z "$MODL_FILE" ]; then
            echo "ERROR: No signed .modl file found in build/"
            ls -la build/
            exit 1
          fi
          if ! unzip -l "$MODL_FILE" | grep -q "certificates.p7b"; then
            echo "ERROR: Module appears unsigned (no certificates.p7b in modl)"
            exit 1
          fi
          echo "file=$MODL_FILE" >> $GITHUB_OUTPUT
          echo "Verified signed module: $MODL_FILE"

          # Find unsigned modl file
          UNSIGNED_FILE=$(find build -maxdepth 1 -name "Python3-*.unsigned.modl" | head -1)
          if [ -n "$UNSIGNED_FILE" ]; then
            echo "unsigned_file=$UNSIGNED_FILE" >> $GITHUB_OUTPUT
            echo "Found unsigned module: $UNSIGNED_FILE"
          else
            echo "No unsigned module found (signing-only build)"
          fi

      - name: Create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          MODL_FILE: ${{ steps.modl.outputs.file }}
          UNSIGNED_FILE: ${{ steps.modl.outputs.unsigned_file }}
        run: |
          ASSETS=("${MODL_FILE}")
          if [ -n "$UNSIGNED_FILE" ]; then
            ASSETS+=("${UNSIGNED_FILE}")
          fi
          gh release create "${REF_NAME}" \
            "${ASSETS[@]}" \
            --title "Python 3 Integration ${REF_NAME}" \
            --generate-notes

      - name: Create portal release
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          MODL_FILE: ${{ steps.modl.outputs.file }}
        run: |
          TAG="python3-integration-${REF_NAME}"

          gh release delete "$TAG" --repo Gaskony-Ignition/ignition-modules-portal --yes 2>/dev/null || true
          gh api repos/Gaskony-Ignition/ignition-modules-portal/git/refs/tags/"$TAG" -X DELETE 2>/dev/null || true

          gh release create "$TAG" \
            "${MODL_FILE}" \
            --repo Gaskony-Ignition/ignition-modules-portal \
            --title "Python 3 Integration v${VERSION}" \
            --notes "## Python 3 Integration v${VERSION}

          Full Python 3 scripting environment with an integrated IDE in Ignition Designer.

          ### Installation
          1. Download \`Python3-${VERSION}.modl\` below
          2. Ignition Gateway: Config > System > Modules > Install or Upgrade
          3. Upload the .modl file
          4. Ensure Python 3.8+ is installed on the Gateway server

          **Requires:** Ignition 8.3+ | Java 17 | Python 3.8+"

      - name: Update portal README
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: /tmp
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Gaskony-Ignition/ignition-modules-portal.git portal
          cd portal

          export VERSION
          python3 -c "
          import re, os
          VERSION = os.environ['VERSION']
          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'Python3-[\d.]+\.modl', f'Python3-{VERSION}.modl', content)
          # Migrate old name to new name
          content = content.replace('Python 3 IDE', 'Python 3 Integration')
          content = content.replace('python3-ide', 'python3-integration')
          content = content.replace('#python-3-ide', '#python-3-integration')
          # Update version references
          content = re.sub(r'python3-integration-v[\d.]+', f'python3-integration-v{VERSION}', content)
          content = re.sub(
              r'(### Python 3 Integration.*?\*\*Latest Version\*\* \| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content, flags=re.DOTALL, count=1
          )
          content = re.sub(
              r'(\| Python 3 Integration\s*\| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content
          )
          with open('README.md', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update Python 3 Integration to v${VERSION}"
          git push

name: Email Notifications

on:
  workflow_run:
    workflows: ["Tests and Coverage", "Build Module", "Code Quality", "CI - Build and Security"]
    types:
      - completed

jobs:
  notify-failure:
    name: Send Email Notification
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate CI Summary
        run: |
          bash .github/scripts/ci-summary.sh ci_summary.log || echo "Summary generation failed"

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration (GitHub secrets required)
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          # Email details
          subject: "❌ CI/CD Failed: ${{ github.event.workflow_run.name }} (${{ github.repository }})"
          from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
          to: ${{ secrets.NOTIFICATION_EMAIL }}

          # Email content
          body: |
            CI/CD Pipeline Failure Report

            Repository: ${{ github.repository }}
            Workflow: ${{ github.event.workflow_run.name }}
            Run ID: ${{ github.event.workflow_run.id }}
            Run Number: ${{ github.event.workflow_run.run_number }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Actor: ${{ github.event.workflow_run.actor.login }}

            Status: ${{ github.event.workflow_run.conclusion }}

            View Details: ${{ github.event.workflow_run.html_url }}

            ---
            This is an automated notification from GitHub Actions.

          # Attachments
          attachments: ci_summary.log

          # Optional: HTML email
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .header { background-color: #d73a49; color: white; padding: 20px; }
                .content { padding: 20px; }
                .info { background-color: #f6f8fa; padding: 15px; border-left: 4px solid #0366d6; margin: 10px 0; }
                .footer { background-color: #f6f8fa; padding: 10px; text-align: center; font-size: 12px; }
                a { color: #0366d6; text-decoration: none; }
                code { background-color: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
              </style>
            </head>
            <body>
              <div class="header">
                <h1>❌ CI/CD Pipeline Failed</h1>
              </div>

              <div class="content">
                <h2>Failure Report</h2>

                <div class="info">
                  <strong>Repository:</strong> ${{ github.repository }}<br>
                  <strong>Workflow:</strong> ${{ github.event.workflow_run.name }}<br>
                  <strong>Branch:</strong> ${{ github.event.workflow_run.head_branch }}<br>
                  <strong>Commit:</strong> <code>${{ github.event.workflow_run.head_sha }}</code><br>
                  <strong>Actor:</strong> ${{ github.event.workflow_run.actor.login }}<br>
                  <strong>Status:</strong> <span style="color: #d73a49; font-weight: bold;">${{ github.event.workflow_run.conclusion }}</span>
                </div>

                <p>
                  <a href="${{ github.event.workflow_run.html_url }}" style="display: inline-block; background-color: #0366d6; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none;">
                    View Workflow Run →
                  </a>
                </p>

                <h3>Next Steps</h3>
                <ol>
                  <li>Review the workflow logs for error details</li>
                  <li>Check the attached CI summary for test/build results</li>
                  <li>Fix the issues and push a new commit</li>
                  <li>Re-run the workflow if needed</li>
                </ol>
              </div>

              <div class="footer">
                This is an automated notification from GitHub Actions<br>
                Run ID: ${{ github.event.workflow_run.id }} | Run Number: ${{ github.event.workflow_run.run_number }}
              </div>
            </body>
            </html>
        continue-on-error: true  # Don't fail if email sending fails

  notify-success:
    name: Log Success (Optional)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Log Success
        run: |
          echo "✅ Workflow succeeded: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Actor: ${{ github.event.workflow_run.actor.login }}"

          # Optional: Add success email notifications here if desired
          # For now, we only send notifications on failures to reduce noise

# ============================================================================
# CONFIGURATION INSTRUCTIONS
# ============================================================================
#
# To enable email notifications, add these GitHub Secrets to your repository:
#
# 1. Go to: Settings → Secrets and variables → Actions → New repository secret
#
# 2. Add the following secrets:
#    - SMTP_SERVER: Your SMTP server (e.g., smtp.gmail.com)
#    - SMTP_PORT: SMTP port (e.g., 587 for TLS, 465 for SSL)
#    - SMTP_USERNAME: Your email address
#    - SMTP_PASSWORD: Your email password or app-specific password
#    - NOTIFICATION_EMAIL: Email address to receive notifications
#
# 3. For Gmail users:
#    - Use an "App Password" instead of your regular password
#    - Enable 2FA: https://myaccount.google.com/security
#    - Create App Password: https://myaccount.google.com/apppasswords
#    - Server: smtp.gmail.com, Port: 587
#
# 4. Alternative: Use SendGrid, AWS SES, or other email services
#    - Update server_address and server_port accordingly
#    - Use API keys instead of passwords when available
#
# ============================================================================

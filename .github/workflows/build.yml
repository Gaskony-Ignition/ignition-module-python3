name: Build Module

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Ignition Module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        working-directory: python3-integration
        run: chmod +x gradlew

      - name: Build module
        working-directory: python3-integration
        run: ./gradlew clean build --no-daemon --info

      - name: Get version
        id: version
        working-directory: python3-integration
        run: |
          VERSION=$(grep -oP 'version.major=\K\d+' version.properties).$(grep -oP 'version.minor=\K\d+' version.properties).$(grep -oP 'version.patch=\K\d+' version.properties)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Module version: $VERSION"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: python3-integration-module-${{ steps.version.outputs.VERSION }}
          path: python3-integration/build/libs/*.modl
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: python3-integration/build/libs/*.modl
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 17" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version:** 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Module artifact uploaded: \`python3-integration-module-${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY

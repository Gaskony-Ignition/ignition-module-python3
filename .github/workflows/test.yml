name: Tests and Coverage

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python installation
        run: |
          python3 --version
          which python3

      - name: Grant execute permission for gradlew
        working-directory: python3-integration
        run: chmod +x gradlew

      - name: Run tests with coverage
        working-directory: python3-integration
        run: ./gradlew test jacocoTestReport --no-daemon --info

      - name: Generate coverage badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: python3-integration/gateway/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          generate-summary: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: python3-integration/gateway/build/reports/jacoco/test/html/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: python3-integration/gateway/build/reports/tests/test/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: python3-integration/gateway/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          title: Code Coverage Report

      - name: Check coverage threshold
        working-directory: python3-integration
        run: |
          # Extract coverage percentage from HTML report
          COVERAGE=$(grep -oP 'Total.*?<td class="ctr2">\K[0-9]+(?=%)' gateway/build/reports/jacoco/test/html/index.html | head -1)
          echo "Current coverage: ${COVERAGE}%"

          # Minimum acceptable coverage (start at 5%, increase over time)
          MIN_COVERAGE=5

          if [ "$COVERAGE" -lt "$MIN_COVERAGE" ]; then
            echo "❌ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 17" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version:** 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage report uploaded as artifact: \`coverage-report\`" >> $GITHUB_STEP_SUMMARY
          echo "- Test results uploaded as artifact: \`test-results\`" >> $GITHUB_STEP_SUMMARY

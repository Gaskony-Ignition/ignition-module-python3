# GitLab CI/CD Pipeline for Python 3 Integration Module
# Mirrors GitHub Actions functionality for platform parity

# Define pipeline stages
stages:
  - setup
  - lint
  - test
  - build
  - security
  - deploy

# Global variables
variables:
  # Java configuration
  JAVA_VERSION: "17"
  JAVA_OPTS: "-Xmx1g"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # Python configuration
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  # Module configuration
  MODULE_DIR: "python3-integration"

  # Artifact retention
  ARTIFACT_RETENTION: "90 days"

# Cache configuration for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .gradle/wrapper
    - .gradle/caches

# Default Docker image
default:
  image: eclipse-temurin:17-jdk

# ============================================================================
# STAGE 1: SETUP
# ============================================================================

setup:
  stage: setup
  script:
    - echo "Setting up build environment..."
    - java -version
    - python3 --version
    - cd $MODULE_DIR
    - chmod +x gradlew
    - ./gradlew --version
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour

# ============================================================================
# STAGE 2: LINT & CODE QUALITY
# ============================================================================

checkstyle:
  stage: lint
  script:
    - echo "Running Checkstyle (Java code quality)..."
    - cd $MODULE_DIR
    - chmod +x gradlew
    - ./gradlew checkstyleMain checkstyleTest --no-daemon || echo "⚠️  Checkstyle issues found"
  artifacts:
    paths:
      - $MODULE_DIR/build/reports/checkstyle/
    reports:
      junit: $MODULE_DIR/build/reports/checkstyle/*.xml
    expire_in: $ARTIFACT_RETENTION
  allow_failure: true

python-quality:
  stage: lint
  image: python:3.11
  script:
    - echo "Running Python quality checks..."
    - pip install --upgrade pip
    - pip install black==23.12.1 flake8==7.0.0 mypy==1.8.0 bandit==1.7.6 pip-audit==2.7.0

    - echo "::group::Black - Code Formatting Check"
    - cd $MODULE_DIR/gateway/src/main/resources
    - black --check --diff python_bridge.py || echo "⚠️  Black formatting issues found (non-blocking)"

    - echo "::group::Flake8 - PEP 8 Linting"
    - flake8 --config ../../../../../../config/python/.flake8 python_bridge.py || echo "⚠️  Flake8 linting issues found (non-blocking)"

    - echo "::group::MyPy - Static Type Checking"
    - cd $CI_PROJECT_DIR
    - mypy --config-file config/python/mypy.ini || echo "⚠️  MyPy type checking issues found (non-blocking)"

    - echo "::group::Bandit - Python Security Scanner"
    - cd $MODULE_DIR/gateway/src/main/resources
    - bandit -c ../../../../../../config/python/.bandit -r python_bridge.py || echo "⚠️  Bandit security issues found (non-blocking)"
  allow_failure: true
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    expire_in: $ARTIFACT_RETENTION

# ============================================================================
# STAGE 3: TEST
# ============================================================================

test:
  stage: test
  needs: [setup]
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip
    - python3 --version
  script:
    - echo "Running tests with JaCoCo coverage..."
    - cd $MODULE_DIR
    - chmod +x gradlew
    - ./gradlew test jacocoTestReport --no-daemon --info

    # Extract coverage percentage
    - |
      if [ -f "gateway/build/reports/jacoco/test/html/index.html" ]; then
        COVERAGE=$(grep -oP 'Total.*?<td class="ctr2">\K[0-9]+(?=%)' gateway/build/reports/jacoco/test/html/index.html | head -1)
        echo "Current coverage: ${COVERAGE}%"

        # Minimum acceptable coverage (5% initially)
        MIN_COVERAGE=5
        if [ "$COVERAGE" -lt "$MIN_COVERAGE" ]; then
          echo "❌ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
        fi
      fi
  artifacts:
    paths:
      - $MODULE_DIR/gateway/build/reports/jacoco/
      - $MODULE_DIR/gateway/build/reports/tests/
    reports:
      junit: $MODULE_DIR/gateway/build/test-results/test/*.xml
      coverage_report:
        coverage_format: cobertura
        path: $MODULE_DIR/gateway/build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: $ARTIFACT_RETENTION
  coverage: '/Total.*?([0-9]{1,3})%/'

# Matrix testing - Python versions
test:python-3.9:
  extends: test
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y python3.9 python3-pip
    - python3.9 --version
  only:
    - master
    - main
    - merge_requests

test:python-3.12:
  extends: test
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y python3.12 python3-pip
    - python3.12 --version
  only:
    - master
    - main
    - merge_requests

# ============================================================================
# STAGE 4: BUILD
# ============================================================================

build:
  stage: build
  needs: [test]
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y python3
  script:
    - echo "Building Ignition module..."
    - cd $MODULE_DIR
    - chmod +x gradlew

    # NOTE: Certificates are committed to the repository (keystore.jks, certificate.der)
    # See CLAUDE.md section "Certificate Management" - DO NOT regenerate certificates
    # This ensures consistent signatures across all environments and CI/CD pipelines

    - ./gradlew clean build --no-daemon --stacktrace

    # Verify module file created
    - |
      if ls build/*.modl 1> /dev/null 2>&1; then
        echo "✅ Module file created successfully"
        ls -lh build/*.modl
      else
        echo "❌ Module file not found"
        exit 1
      fi

    # Extract version from version.properties
    - |
      VERSION=$(grep -oP 'version.major=\K\d+' version.properties).$(grep -oP 'version.minor=\K\d+' version.properties).$(grep -oP 'version.patch=\K\d+' version.properties)
      echo "Module version: $VERSION"
      echo "MODULE_VERSION=$VERSION" >> build.env
  artifacts:
    paths:
      - $MODULE_DIR/build/libs/*.modl
    reports:
      dotenv: $MODULE_DIR/build.env
    expire_in: $ARTIFACT_RETENTION

# ============================================================================
# STAGE 5: SECURITY
# ============================================================================

dependency-check:
  stage: security
  needs: [setup]
  script:
    - echo "Running OWASP Dependency Check..."
    - cd $MODULE_DIR
    - chmod +x gradlew
    - ./gradlew dependencyCheckAnalyze --no-daemon || echo "⚠️  Dependency vulnerabilities found (non-blocking)"
  artifacts:
    paths:
      - $MODULE_DIR/build/reports/dependency-check-report.html
    expire_in: $ARTIFACT_RETENTION
  allow_failure: true

secret-scan:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - echo "Running Gitleaks secret scanning..."
    - gitleaks detect --source . --verbose --no-git || echo "⚠️  Potential secrets found"
  allow_failure: true

# ============================================================================
# STAGE 6: DEPLOY (Manual)
# ============================================================================

deploy:development:
  stage: deploy
  needs: [build]
  script:
    - echo "Deploying to development environment..."
    - echo "Module version: $MODULE_VERSION"
    - echo "Upload .modl file to Ignition Gateway at: http://localhost:8088"
    - ls -lh $MODULE_DIR/build/libs/*.modl
  when: manual
  only:
    - develop
  environment:
    name: development
    url: http://localhost:8088

deploy:production:
  stage: deploy
  needs: [build]
  script:
    - echo "Creating GitLab release..."
    - echo "Module version: $MODULE_VERSION"
    - ls -lh $MODULE_DIR/build/libs/*.modl
  when: manual
  only:
    - tags
  environment:
    name: production
  artifacts:
    paths:
      - $MODULE_DIR/build/libs/*.modl
    expire_in: never

# ============================================================================
# WORKFLOW RULES
# ============================================================================

workflow:
  rules:
    # Run pipeline on merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline on main/master branches
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    # Run pipeline on develop branch
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run pipeline on tags
    - if: $CI_COMMIT_TAG
    # Manual pipeline runs
    - if: $CI_PIPELINE_SOURCE == "web"
